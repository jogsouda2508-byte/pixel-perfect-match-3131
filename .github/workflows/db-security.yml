name: Database security

# Replays every Supabase migration on a throwaway Postgres 16, then attacks the result as a
# signed-out visitor, a stranger and a blocked user (supabase/tests/replay/security.assert.sql).
# Nothing here touches your real Supabase project.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rls-and-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sh supabase/tests/replay/run.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/auth-lookup/index.ts
